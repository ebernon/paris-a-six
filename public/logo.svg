<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6c97a"/>
      <stop offset="50%" stop-color="#d4b06a"/>
      <stop offset="100%" stop-color="#b8964a"/>
    </linearGradient>
    <linearGradient id="towerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4b06a"/>
      <stop offset="100%" stop-color="#b8964a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#b8964a" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#b8964a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#b8964a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft halo behind tower -->
  <circle cx="200" cy="180" r="170" fill="url(#halo)"/>

  <!-- decorative top ornament -->
  <g stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.85">
    <line x1="80" y1="46" x2="155" y2="46"/>
    <line x1="245" y1="46" x2="320" y2="46"/>
    <circle cx="200" cy="46" r="3.5" fill="url(#goldGrad)" stroke="none"/>
    <circle cx="170" cy="46" r="1.5" fill="url(#goldGrad)" stroke="none"/>
    <circle cx="230" cy="46" r="1.5" fill="url(#goldGrad)" stroke="none"/>
  </g>

  <!-- MAY 2026 label -->
  <text x="200" y="76" text-anchor="middle"
        font-family="'Jost', 'Helvetica Neue', sans-serif"
        font-size="11" letter-spacing="6"
        fill="#b8964a" font-weight="500">MAY · 2026</text>

  <!-- Eiffel Tower (elegant line-art) -->
  <g stroke="url(#towerGrad)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- antenna / spire -->
    <line x1="200" y1="100" x2="200" y2="118" stroke-width="1.6"/>
    <circle cx="200" cy="98" r="1.8" fill="url(#towerGrad)" stroke="none"/>

    <!-- top section (above 2nd platform) -->
    <line x1="194" y1="118" x2="200" y2="118" stroke-width="1.6"/>
    <line x1="200" y1="118" x2="206" y2="118" stroke-width="1.6"/>
    <path d="M 192 130 L 200 118 L 208 130" stroke-width="1.6"/>
    <line x1="190" y1="135" x2="210" y2="135" stroke-width="1.4"/>

    <!-- upper trunk -->
    <path d="M 190 135 L 184 175 M 210 135 L 216 175" stroke-width="1.6"/>
    <line x1="184" y1="175" x2="216" y2="175" stroke-width="1.6"/>

    <!-- second platform area -->
    <line x1="180" y1="180" x2="220" y2="180" stroke-width="1.4"/>
    <path d="M 184 175 L 175 230 M 216 175 L 225 230" stroke-width="1.8"/>

    <!-- decorative cross-braces (upper) -->
    <path d="M 188 185 L 212 215 M 212 185 L 188 215" stroke-width="0.8" opacity="0.7"/>
    <path d="M 184 220 L 216 220" stroke-width="0.8" opacity="0.7"/>

    <!-- second platform -->
    <line x1="172" y1="232" x2="228" y2="232" stroke-width="2"/>
    <line x1="172" y1="236" x2="228" y2="236" stroke-width="1"/>

    <!-- middle trunk widening -->
    <path d="M 175 236 L 158 320 M 225 236 L 242 320" stroke-width="2"/>

    <!-- arch (signature feature) -->
    <path d="M 168 320 Q 200 275 232 320" stroke-width="1.6"/>
    <path d="M 178 320 Q 200 290 222 320" stroke-width="1" opacity="0.7"/>

    <!-- mid cross-braces -->
    <path d="M 175 250 L 225 305 M 225 250 L 175 305" stroke-width="0.8" opacity="0.55"/>
    <path d="M 175 270 L 225 270" stroke-width="0.7" opacity="0.55"/>
    <path d="M 175 290 L 225 290" stroke-width="0.7" opacity="0.55"/>

    <!-- first platform -->
    <line x1="155" y1="322" x2="245" y2="322" stroke-width="2.2"/>
    <line x1="155" y1="326" x2="245" y2="326" stroke-width="1"/>

    <!-- legs -->
    <path d="M 158 326 L 130 400 M 242 326 L 270 400" stroke-width="2.4"/>

    <!-- base lattice -->
    <path d="M 152 340 L 168 395 M 248 340 L 232 395" stroke-width="0.9" opacity="0.55"/>
    <path d="M 145 360 L 255 360" stroke-width="0.7" opacity="0.5"/>
    <path d="M 138 380 L 262 380" stroke-width="0.7" opacity="0.5"/>

    <!-- ground line with arches between legs -->
    <path d="M 130 400 Q 200 388 270 400" stroke-width="1.4" opacity="0.6"/>
  </g>

  <!-- ornamental flourish below tower -->
  <g stroke="url(#goldGrad)" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.85">
    <line x1="100" y1="418" x2="170" y2="418"/>
    <line x1="230" y1="418" x2="300" y2="418"/>
    <path d="M 175 418 Q 200 408 225 418" />
    <circle cx="200" cy="418" r="2" fill="url(#goldGrad)" stroke="none"/>
  </g>

  <!-- PARIS wordmark -->
  <text x="200" y="450" text-anchor="middle"
        font-family="'Playfair Display', 'Times New Roman', serif"
        font-size="34" letter-spacing="8"
        fill="#1a1710" font-weight="400">PARIS</text>

  <!-- à Six -->
  <text x="200" y="475" text-anchor="middle"
        font-family="'Cormorant Garamond', 'Georgia', serif"
        font-size="20" font-style="italic"
        fill="#b8964a" font-weight="400">à Six</text>
</svg>
